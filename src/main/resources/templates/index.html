<!DOCTYPE html>
<!--Most of this was written with the help of Gemini-->
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>The Shrek E-Commerce Website!</title>
</head>
<body>
<h1 style="background: lightgreen; padding: 10px;" >The Shrek E-Commerce Website!</h1>

<!-- SECTION 1: ITEMS IN STOCK -->
<h3>Current Items In Stock:</h3>
<ul>
    <!-- Loop through the INVENTORY (products) -->
    <li th:each="product : ${products}" style="margin-bottom: 5px;">

        <!-- This form allows us to send data to the /add endpoint -->
        <form action="/add" method="post" style="display: inline;">

            <!-- Display Name and Price -->
            <span th:text="${product.name}" style="font-weight: bold;">Name</span>
            <span th:text="' ($' + ${product.price} + ')'">($0.00)</span>

            <!-- Hidden input stores the name of the product we want to add -->
            <input type="hidden" name="productID" th:value="${product.id}" />

            <!-- The Add Button -->
            <button type="submit" style="margin-left: 10px;">Add to Cart</button>
        </form>
    </li>
</ul>
<form action="/submit_form" method="POST">
</form>

<hr style="margin: 20px 0;">

<!-- SECTION 2: CHECKOUT & CART -->
<form action="/payment" method="post" style="background: #f0f0f0; padding: 20px;">

    <h3>Your Cart:</h3>

    <!-- Loop through the CART (from session) -->
    <ul th:if="${not #lists.isEmpty(cart)}">
        <li th:each="cartItem, iterStat : ${cart}">
            <span th:text="${cartItem.getName()}">Item</span>
            <span th:text="' - $' + ${cartItem.getPrice()}"></span>
            <input type="checkbox" id="giftWrappedIndices" name="giftWrappedIndices" th:value="${iterStat.index}"
                   th:id="'wrap-' + ${iterStat.index}" ></input>
            <label for="giftWrappedIndices"> Do you want this gift-wrapped? </label><br>

        </li>
    </ul>

    <!-- Message if cart is empty -->
    <p th:if="${#lists.isEmpty(cart)}" style="color: gray; font-style: italic;">
        Your swamp cart is empty! Add items above.
    </p>

    <p>Total Owed: $<span th:text="${cartTotal}"></span></p>


    <br>
    <label>Choose Payment:</label>
    <select name="paymentMethod">
        <option value="paymentplan">Payment Plan (12 months)</option>
        <option value="cash">Cash</option>
        <option value="creditcard">Credit Card</option>

    </select>


    <button type="submit">Buy Now</button>
</form>

</body>
</html>
