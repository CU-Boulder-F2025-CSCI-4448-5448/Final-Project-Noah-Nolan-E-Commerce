<!DOCTYPE html>
<!--Most of this was written with the help of Gemini-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Swamp Shop Checkout</title>
</head>
<body>
<h1 style="background: lightgreen; padding: 10px;" >Swamp Shop Checkout</h1>

<!-- Display Results from Java if they exist -->
<div th:if="${message}" style="background: lightgreen; padding: 10px;">
    <h3 th:text="${message}"></h3>
    <p>Total Paid: <span th:text="${total}"></span></p>
</div>

<!-- The Form: Triggers the Java @PostMapping("/checkout") -->
<form action="/checkout" method="post">

    <h3>Your Cart:</h3>
    <ul>
        <li>Shrek Mask ($20.00)</li>
        <li>Shrek T-Shirt ($30.00)</li>
    </ul>

    <label>Choose Payment:</label>
    <select name="paymentType">
        <option value="PLAN">Payment Plan (4 months)</option>
        <option value="CASH">Cash</option>
    </select>

    <button type="submit">Buy Now</button>
</form>

</body>
</html>
